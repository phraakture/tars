[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["phraakture"]
repository = "https://github.com/phraakture/tars"
homepage = "https://github.com/phraakture/tars"
description = "A Rust agent harness for LLM-powered coding assistance"

[workspace.dependencies]
# internal crates — edges must form a DAG:
#   base -> plugin -> engine -> lib
#   base -> client -> agent (via lib)
#   base <============ plugin-worker
tars-base = { path = "crates/base", version = "0.1.0" }
tars-client = { path = "crates/client", version = "0.1.0" }
tars-engine = { path = "crates/engine", version = "0.1.0" }
tars-lib = { path = "crates/lib", version = "0.1.0" }
tars-plugin = { path = "crates/plugin", version = "0.1.0" }
tars-plugin-tasks = { path = "crates/plugin-tasks", version = "0.1.0" }
tars-plugin-worker = { path = "crates/plugin-worker", version = "0.1.0" }
tars-tui = { path = "crates/tui", version = "0.1.0" }

# external deps — centralized here, crates use `workspace = true`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "http2", "system-proxy"] }
bytes = "1"
chrono = "0.4"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
